<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f9f6">
    <meta name="description" content="400 вопросов по поликлинической терапии. Обучение, экзамен и повторение ошибок в исходном порядке PDF.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Практика — поликлиническая терапия</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" data-action="home" aria-label="Практика — на главную">
          <span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5C7 4.5 9 5 12 7c3-2 5-2.5 8-1.5V19c-3-1-5-.5-8 1.5C9 18.5 7 18 4 19zM12 7v13M8 10v5m-2.5-2.5h5"/></svg></span>
          <span>Практика<span class="brand-caption">поликлиническая терапия</span></span>
        </a>
        <div class="header-actions"><span class="header-badge">400 вопросов</span><button class="icon-button" data-action="settings" aria-label="Настройки и сохранение прогресса" title="Ваши данные"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg></button></div>
      </div>
    </header>
    <div id="notice" class="notice" role="status" hidden></div>
    <main id="main" class="main" tabindex="-1"><div class="loading" role="status"><span class="loading-dot"></span> Загружаем вопросы…</div></main>
    <footer class="site-footer"><span>Шаг за шагом, вопрос за вопросом.</span><button class="text-button" data-action="about">О тренажёре</button></footer>
    <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <noscript><p class="notice">Для работы тренажёра включите JavaScript в браузере.</p></noscript>
  </body>
</html>
